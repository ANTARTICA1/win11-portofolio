<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="gkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="gkHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
    <linearGradient id="gkSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fcd34d" />
    </linearGradient>
    <linearGradient id="gkShirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="url(#gkBg)" />

  <!-- Outer Ring Accent -->
  <circle cx="60" cy="60" r="56" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- Modern Tech Developer Character -->
  <!-- Shoulders & Hoodie -->
  <path d="M22 110 C22 84, 38 78, 60 78 C82 78, 98 84, 98 110 Z" fill="url(#gkShirt)" filter="url(#softGlow)" />
  <!-- Hoodie Collar V -->
  <path d="M50 78 L60 92 L70 78" stroke="#334155" stroke-width="3" fill="none" />
  <!-- Lanyard / Badge -->
  <path d="M56 92 L56 108 M64 92 L64 108" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <rect x="52" y="102" width="16" height="12" rx="2" fill="#38bdf8" />

  <!-- Neck -->
  <rect x="52" y="66" width="16" height="16" rx="4" fill="#fcd34d" />

  <!-- Head -->
  <ellipse cx="60" cy="52" rx="21" ry="24" fill="url(#gkSkin)" filter="url(#softGlow)" />

  <!-- Cool Modern Hair -->
  <path d="M38 48 C36 32, 48 20, 62 20 C76 20, 84 28, 83 38 C80 34, 74 30, 66 31 C56 32, 50 36, 46 42 C44 45, 41 46, 38 48 Z" fill="url(#gkHair)" />
  <path d="M38 46 C37 40, 42 34, 48 30 C55 26, 68 25, 78 30" stroke="#4a5568" stroke-width="1.5" fill="none" />

  <!-- Ears -->
  <circle cx="39" cy="54" r="5" fill="#fcd34d" />
  <circle cx="81" cy="54" r="5" fill="#fcd34d" />

  <!-- Modern Tech Developer Glasses -->
  <rect x="44" y="46" width="13" height="10" rx="3" fill="none" stroke="#0f172a" stroke-width="2.2" />
  <rect x="63" y="46" width="13" height="10" rx="3" fill="none" stroke="#0f172a" stroke-width="2.2" />
  <line x1="57" y1="51" x2="63" y2="51" stroke="#0f172a" stroke-width="2.2" />
  <line x1="39" y1="50" x2="44" y2="50" stroke="#0f172a" stroke-width="2" />
  <line x1="76" y1="50" x2="81" y2="50" stroke="#0f172a" stroke-width="2" />

  <!-- Eyes behind glasses -->
  <circle cx="50.5" cy="51" r="2.2" fill="#1e293b" />
  <circle cx="69.5" cy="51" r="2.2" fill="#1e293b" />
  <circle cx="51.5" cy="50" r="0.8" fill="#ffffff" />
  <circle cx="70.5" cy="50" r="0.8" fill="#ffffff" />

  <!-- Friendly Smile -->
  <path d="M54 62 Q60 67 66 62" stroke="#b45309" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Online Green Badge on avatar corner -->
  <circle cx="92" cy="92" r="10" fill="#202c33" />
  <circle cx="92" cy="92" r="7" fill="#22c55e" />
</svg>
