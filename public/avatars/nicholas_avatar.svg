<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3b3b44" />
      <stop offset="100%" stop-color="#14151a" />
    </radialGradient>
    <linearGradient id="earLeftGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b2cc94"/>
      <stop offset="50%" stop-color="#93b074"/>
      <stop offset="100%" stop-color="#e29b9b"/>
    </linearGradient>
    <linearGradient id="earRightGrad" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b2cc94"/>
      <stop offset="50%" stop-color="#93b074"/>
      <stop offset="100%" stop-color="#e29b9b"/>
    </linearGradient>
    <radialGradient id="skinGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#bfd99e"/>
      <stop offset="70%" stop-color="#91b073"/>
      <stop offset="100%" stop-color="#738e55"/>
    </radialGradient>
    <radialGradient id="eyeGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#3c2f23"/>
      <stop offset="40%" stop-color="#19110b"/>
      <stop offset="100%" stop-color="#050302"/>
    </radialGradient>
    <linearGradient id="robeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d6be96"/>
      <stop offset="40%" stop-color="#b3976f"/>
      <stop offset="100%" stop-color="#7a6242"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" />

  <!-- Grogu Ears -->
  <!-- Left Ear -->
  <path d="M 36 45 C 22 36, 6 36, 2 46 C 4 54, 18 53, 34 52 Z" fill="url(#earLeftGrad)" filter="url(#softShadow)" />
  <!-- Left Ear Inner Pink -->
  <path d="M 32 46 C 22 41, 10 42, 6 47 C 9 51, 18 50, 31 49 Z" fill="#cf868b" opacity="0.65" />

  <!-- Right Ear -->
  <path d="M 64 45 C 78 36, 94 36, 98 46 C 96 54, 82 53, 66 52 Z" fill="url(#earRightGrad)" filter="url(#softShadow)" />
  <!-- Right Ear Inner Pink -->
  <path d="M 68 46 C 78 41, 90 42, 94 47 C 91 51, 82 50, 69 49 Z" fill="#cf868b" opacity="0.65" />

  <!-- Head -->
  <ellipse cx="50" cy="46" rx="20" ry="16" fill="url(#skinGrad)" filter="url(#softShadow)" />

  <!-- Forehead wrinkles -->
  <path d="M 44 36 Q 50 34 56 36" stroke="#68814c" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M 42 39 Q 50 37 58 39" stroke="#68814c" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.5" />

  <!-- Large expressive eyes -->
  <!-- Left eye -->
  <ellipse cx="41" cy="46" rx="5.5" ry="6" fill="url(#eyeGrad)" />
  <!-- Left Eye Highlights -->
  <circle cx="39" cy="43.5" r="2.2" fill="#ffffff" opacity="0.9" />
  <circle cx="43" cy="48" r="0.9" fill="#ffffff" opacity="0.6" />

  <!-- Right eye -->
  <ellipse cx="59" cy="46" rx="5.5" ry="6" fill="url(#eyeGrad)" />
  <!-- Right Eye Highlights -->
  <circle cx="57" cy="43.5" r="2.2" fill="#ffffff" opacity="0.9" />
  <circle cx="61" cy="48" r="0.9" fill="#ffffff" opacity="0.6" />

  <!-- Eyelid wrinkles -->
  <path d="M 35 42 Q 41 39 46 43" stroke="#637c47" stroke-width="1.2" fill="none" opacity="0.7" />
  <path d="M 65 42 Q 59 39 54 43" stroke="#637c47" stroke-width="1.2" fill="none" opacity="0.7" />

  <!-- Cute Little Nose -->
  <ellipse cx="50" cy="51" rx="1.8" ry="1.2" fill="#718d52" />
  <circle cx="49" cy="51.5" r="0.5" fill="#4d6235" />
  <circle cx="51" cy="51.5" r="0.5" fill="#4d6235" />

  <!-- Cute Mouth -->
  <path d="M 47 55 Q 50 56.5 53 55" stroke="#4d6235" stroke-width="1.3" stroke-linecap="round" fill="none" />

  <!-- Robe Collar (Fluffy/Warm Sherpa coat) -->
  <path d="M 28 66 Q 50 60 72 66 L 75 92 Q 50 96 25 92 Z" fill="url(#robeGrad)" />
  <!-- Fluffy Collar roll -->
  <ellipse cx="50" cy="65" rx="22" ry="7.5" fill="#edd6b1" />
  <ellipse cx="50" cy="67" rx="19" ry="5.5" fill="#caa97d" />
  <path d="M 33 65 Q 50 71 67 65" stroke="#9e7e54" stroke-width="1.5" fill="none" opacity="0.5" />
</svg>
