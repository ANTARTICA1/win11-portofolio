<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="frameGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="photoSkyGrad" x1="10" y1="10" x2="38" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="28" y1="28" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Outer Photo Frame -->
  <rect x="5" y="6" width="38" height="32" rx="5" fill="url(#frameGrad)" stroke="#78350f" stroke-width="1.5" />
  
  <!-- Frame Inset Border -->
  <rect x="8" y="9" width="32" height="26" rx="3" fill="#0f172a" stroke="#fbbf24" stroke-width="0.8" stroke-opacity="0.6" />

  <!-- Photo Scenery (Sky) -->
  <rect x="10" y="11" width="28" height="22" rx="2" fill="url(#photoSkyGrad)" />

  <!-- Sun in Photo -->
  <circle cx="16" cy="17" r="3" fill="#fef08a" />

  <!-- Mountain Peaks in Photo -->
  <path d="M10 29L18 19L25 28L29 23L38 33H10V29Z" fill="#047857" />
  <path d="M18 29L25 21L33 30L38 25V33H18V29Z" fill="#065f46" opacity="0.85" />

  <!-- Gamepad / Remote Controller Accent Badge at Bottom-Right -->
  <circle cx="36" cy="35" r="9.5" fill="url(#badgeGrad)" stroke="#f59e0b" stroke-width="1.5" />
  
  <!-- Gamepad Icon Silhouette -->
  <!-- Controller Body -->
  <path d="M31.5 34C31.5 32.8 32.5 32 33.8 32H38.2C39.5 32 40.5 32.8 40.5 34C40.5 36.2 39.5 37.5 38.6 37.5C38.2 37.5 37.8 37 37.4 36.2C37.1 35.8 36.6 35.5 36 35.5C35.4 35.5 34.9 35.8 34.6 36.2C34.2 37 33.8 37.5 33.4 37.5C32.5 37.5 31.5 36.2 31.5 34Z" fill="#38bdf8" />
  
  <!-- D-pad cross on left side of controller -->
  <circle cx="33.8" cy="34" r="0.8" fill="#ffffff" />
  
  <!-- Buttons on right side of controller -->
  <circle cx="38" cy="33.5" r="0.7" fill="#fbbf24" />
  <circle cx="39" cy="34.5" r="0.7" fill="#ef4444" />
</svg>
