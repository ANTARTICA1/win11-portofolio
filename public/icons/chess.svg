<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="chessBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="chessKnightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="chessShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base tile with rounded corners -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#chessBgGrad)" stroke="#475569" stroke-width="1.5"/>

  <!-- Subtle 2x2 board pattern inside tile -->
  <rect x="6" y="6" width="18" height="18" fill="#475569" opacity="0.35"/>
  <rect x="24" y="24" width="18" height="18" fill="#475569" opacity="0.35"/>

  <!-- White Knight Icon (Centered) -->
  <g transform="translate(6, 4) scale(0.8)" filter="url(#chessShadow)">
    <path
      d="M 22,10 C 32.5,11 38.5,18 38,39 L 15,39 C 15,30 25,32.5 23,18"
      fill="url(#chessKnightGrad)"
      stroke="#1e293b"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 24,18 C 24.38,20.91 18.45,25.37 16,27 C 13,29 13.18,31.34 11,31 C 9.958,30.06 12.41,27.96 11,28 C 10,28 11.19,29.23 10,30 C 9,30 5.997,31 6,26 C 6,24 12,14 12,14 C 12,14 13.89,12.1 14,10.5 C 13.27,9.506 13.5,8.5 13.5,7.5 C 14.5,6.5 16.5,10 16.5,10 L 18.5,10 C 18.5,10 19.28,8.008 21,7 C 22,7 22,10 22,10 Z"
      fill="url(#chessKnightGrad)"
      stroke="#1e293b"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="15.5" cy="15.5" r="1.5" fill="#1e293b"/>
  </g>
</svg>
