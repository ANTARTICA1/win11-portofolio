  <ellipse cx="24" cy="24" rx="7" ry="14" fill="none" stroke="#ffffff" stroke-width="1.6" />
  <line x1="10" y1="24" x2="38" y2="24" stroke="#ffffff" stroke-width="1.6" />
  <line x1="12.5" y1="17" x2="35.5" y2="17" stroke="#ffffff" stroke-width="1.3" opacity="0.8" />
  <line x1="12.5" y1="31" x2="35.5" y2="31" stroke="#ffffff" stroke-width="1.3" opacity="0.8" />
