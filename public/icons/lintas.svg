<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="lintasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0891b2"/>
      <stop offset="50%" stopColor="#0284c7"/>
      <stop offset="100%" stopColor="#4338ca"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8"/>
      <stop offset="100%" stopColor="#818cf8"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ffffff"/>
      <stop offset="100%" stopColor="#e0f2fe"/>
    </linearGradient>
    <filter id="lintasShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Base App Tile -->
  <rect x="4" y="4" width="40" height="40" rx="10" fill="url(#lintasBg)" filter="url(#lintasShadow)"/>
  
  <!-- Subtle inner border -->
  <rect x="4.5" y="4.5" width="39" height="39" rx="9.5" fill="none" stroke="#67e8f9" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- PC Monitor Graphic (Backdrop) -->
  <rect x="10" y="12" width="20" height="14" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <rect x="12" y="14" width="16" height="10" fill="#1e293b"/>
  <!-- PC Stand -->
  <path d="M18 26 L22 26 L23 29 L17 29 Z" fill="#94a3b8"/>

  <!-- Connecting Sync Beam / Wi-Fi Waves -->
  <path d="M22 17 C25 15, 29 17, 31 20" fill="none" stroke="url(#beamGrad)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 2"/>
  <path d="M24 20 C26 19, 28 20, 29 22" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Smartphone Graphic (Foreground) -->
  <rect x="26" y="18" width="12" height="20" rx="2.5" fill="url(#phoneGrad)" filter="url(#lintasShadow)"/>
  <rect x="27.5" y="20.5" width="9" height="14.5" rx="1" fill="#0284c7"/>
  <!-- Phone home indicator -->
  <circle cx="32" cy="36" r="0.8" fill="#64748b"/>
  <!-- Touchpad indicator on phone screen -->
  <rect x="29" y="22" width="6" height="8" rx="0.5" fill="none" stroke="#e0f2fe" stroke-width="0.6" stroke-dasharray="1 1"/>
  <circle cx="32" cy="26" r="1" fill="#38bdf8"/>
</svg>
