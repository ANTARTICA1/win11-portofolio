<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="nenaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#059669"/>
      <stop offset="50%" stopColor="#10b981"/>
      <stop offset="100%" stopColor="#047857"/>
    </linearGradient>
    <linearGradient id="nenaShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#34d399"/>
      <stop offset="100%" stopColor="#059669"/>
    </linearGradient>
    <linearGradient id="nenaCross" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#ffffff"/>
      <stop offset="100%" stopColor="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="nenaSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fbbf24"/>
      <stop offset="100%" stopColor="#f59e0b"/>
    </linearGradient>
    <filter id="nenaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#022c22" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Base App Tile -->
  <rect x="4" y="4" width="40" height="40" rx="10" fill="url(#nenaBg)" filter="url(#nenaShadow)"/>
  
  <!-- Subtle inner border -->
  <rect x="4.5" y="4.5" width="39" height="39" rx="9.5" fill="none" stroke="#6ee7b7" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- Shield of K3 Protection -->
  <path d="M24 10 L35 14.5 C35 24 29.5 32.5 24 35 C18.5 32.5 13 24 13 14.5 Z" fill="url(#nenaShield)" opacity="0.95" stroke="#a7f3d0" stroke-width="1"/>

  <!-- Safety Cross (First Aid / K3 Symbol) -->
  <rect x="21.5" y="16" width="5" height="13" rx="1.5" fill="url(#nenaCross)"/>
  <rect x="17.5" y="20" width="13" height="5" rx="1.5" fill="url(#nenaCross)"/>

  <!-- AI Gemini Sparkle (Top-Right of Shield) -->
  <path d="M34 11 C34 13.5 32.5 15 30 15 C32.5 15 34 16.5 34 19 C34 16.5 35.5 15 38 15 C35.5 15 34 13.5 34 11 Z" fill="url(#nenaSpark)" filter="url(#nenaShadow)"/>
  <circle cx="34" cy="15" r="1" fill="#fff"/>
</svg>
