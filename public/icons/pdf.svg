<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="pdfDocShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>
    <filter id="pdfBadgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#7F1D1D" flood-opacity="0.4" />
    </filter>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="cornerFold" x1="40" y1="6" x2="54" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="redBadge" x1="8" y1="36" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
  </defs>

  <!-- Document Sheet with Folded Corner -->
  <g filter="url(#pdfDocShadow)">
    <path d="M 14 6 C 11.79 6 10 7.79 10 10 L 10 54 C 10 56.21 11.79 58 14 58 L 50 58 C 52.21 58 54 56.21 54 54 L 54 20 L 40 6 Z" fill="url(#pageBg)" />
    <path d="M 14 6 C 11.79 6 10 7.79 10 10 L 10 54 C 10 56.21 11.79 58 14 58 L 50 58 C 52.21 58 54 56.21 54 54 L 54 20 L 40 6 Z" stroke="#CBD5E1" stroke-width="0.8" />
  </g>

  <!-- Folded Corner Flap -->
  <path d="M 40 6 L 40 18 C 40 19.1 40.9 20 42 20 L 54 20 Z" fill="url(#cornerFold)" />

  <!-- Document Text Preview Lines -->
  <rect x="18" y="16" width="16" height="3" rx="1.5" fill="#E2E8F0" />
  <rect x="18" y="23" width="28" height="3" rx="1.5" fill="#E2E8F0" />
  <rect x="18" y="30" width="28" height="3" rx="1.5" fill="#E2E8F0" />

  <!-- Iconic Red PDF Badge -->
  <g filter="url(#pdfBadgeShadow)">
    <rect x="8" y="37" width="40" height="20" rx="4" fill="url(#redBadge)" />
    <!-- Top gloss highlight -->
    <rect x="9" y="38" width="38" height="1" rx="0.5" fill="#FFFFFF" fill-opacity="0.3" />
  </g>

  <!-- Crisp White Letters "PDF" -->
  <!-- P -->
  <path d="M 15 42 H 19.8 C 21.8 42 23 43 23 44.7 C 23 46.4 21.8 47.4 19.8 47.4 H 17.2 V 51.5 H 15 V 42 Z M 17.2 43.9 V 45.5 H 19.6 C 20.6 45.5 21.1 45.2 21.1 44.7 C 21.1 44.2 20.6 43.9 19.6 43.9 H 17.2 Z" fill="#FFFFFF" />
  <!-- D -->
  <path d="M 24.8 42 H 28.8 C 31.5 42 33.2 43.7 33.2 46.7 C 33.2 49.7 31.5 51.5 28.8 51.5 H 24.8 V 42 Z M 27 43.9 V 49.6 H 28.7 C 30.3 49.6 31.2 48.5 31.2 46.7 C 31.2 44.9 30.3 43.9 28.7 43.9 H 27 Z" fill="#FFFFFF" />
  <!-- F -->
  <path d="M 35 42 H 41.5 V 43.9 H 37.2 V 45.8 H 40.8 V 47.7 H 37.2 V 51.5 H 35 V 42 Z" fill="#FFFFFF" />
</svg>
