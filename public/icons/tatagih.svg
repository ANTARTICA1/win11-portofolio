<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="tatagihBg" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="10" y1="12" x2="38" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect x="4" y="4" width="40" height="40" rx="11" fill="url(#tatagihBg)" />
  <rect x="4.75" y="4.75" width="38.5" height="38.5" rx="10.25" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.3" fill="none" />

  <!-- Inner Subscription Card -->
  <rect x="9" y="11" width="30" height="23" rx="4.5" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" />
  
  <!-- Card Header Line / Chip -->
  <rect x="13" y="15" width="6" height="4.5" rx="1.5" fill="#f59e0b" />
  <rect x="22" y="16" width="13" height="2.5" rx="1.25" fill="#94a3b8" fill-opacity="0.4" />

  <!-- Recurring Circular Arrow / Refresh Cycle -->
  <path d="M19 26.5 A5.5 5.5 0 1 1 29 27" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <polyline points="29 23.5 29 27.5 25 27.5" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Price / Bill Tag Symbol in Center -->
  <circle cx="23.5" cy="26.5" r="1.8" fill="#38bdf8" />

  <!-- Gemini AI Sparkle Star on Top Right -->
  <path d="M37 7 C37 10 39.5 11 41 11 C39.5 11 37 12 37 15 C37 12 34.5 11 33 11 C34.5 11 37 10 37 7 Z" fill="#facc15" />
  <circle cx="34" cy="7" r="0.8" fill="#ffffff" />

  <!-- Small Bottom Telegram Badge / Pulse Dot -->
  <circle cx="35" cy="35" r="6" fill="#0284c7" stroke="#ffffff" stroke-width="1.2" />
  <path d="M32.5 35 L34 36.5 L37.5 33.5" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
