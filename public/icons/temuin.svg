<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="temuinBg" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0a101d" />
    </linearGradient>
    <linearGradient id="temuinBorder" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="pinGrad" x1="28" y1="6" x2="42" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
  </defs>

  <!-- Background Base Container -->
  <rect x="4" y="4" width="40" height="40" rx="10" fill="url(#temuinBg)" stroke="url(#temuinBorder)" stroke-width="2" />
  
  <!-- Subtle Grid Accent -->
  <rect x="7" y="7" width="34" height="34" rx="8" stroke="#06b6d4" stroke-width="0.8" stroke-opacity="0.25" />

  <!-- QR Code Elements (Lost & Found Identity) -->
  <!-- Top-Left QR Target -->
  <rect x="11" y="11" width="10" height="10" rx="2" stroke="#38bdf8" stroke-width="1.8" fill="none" />
  <rect x="14" y="14" width="4" height="4" rx="0.8" fill="#38bdf8" />

  <!-- Bottom-Left QR Target -->
  <rect x="11" y="27" width="10" height="10" rx="2" stroke="#38bdf8" stroke-width="1.8" fill="none" />
  <rect x="14" y="30" width="4" height="4" rx="0.8" fill="#38bdf8" />

  <!-- Bottom-Right QR Target -->
  <rect x="27" y="27" width="10" height="10" rx="2" stroke="#10b981" stroke-width="1.8" fill="none" />
  <rect x="30" y="30" width="4" height="4" rx="0.8" fill="#10b981" />

  <!-- QR Data Bits -->
  <rect x="23" y="12" width="2.5" height="2.5" rx="0.5" fill="#38bdf8" />
  <rect x="23" y="17" width="2.5" height="2.5" rx="0.5" fill="#38bdf8" />
  <rect x="18" y="23" width="2.5" height="2.5" rx="0.5" fill="#38bdf8" />
  <rect x="23" y="23" width="3" height="3" rx="0.6" fill="#10b981" />
  <rect x="23" y="28" width="2.5" height="2.5" rx="0.5" fill="#10b981" />
  <rect x="28" y="23" width="2.5" height="2.5" rx="0.5" fill="#06b6d4" />

  <!-- Overlay Location Pin (GPS Location Marker) -->
  <g filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.6))">
    <path d="M35 7C31.6863 7 29 9.68629 29 13C29 17.5 35 24 35 24C35 24 41 17.5 41 13C41 9.68629 38.3137 7 35 7Z" fill="url(#pinGrad)" stroke="#ffffff" stroke-width="1.2" />
    <circle cx="35" cy="13" r="2.5" fill="#ffffff" />
  </g>
</svg>
