<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="theoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0284c7"/>
      <stop offset="50%" stopColor="#0369a1"/>
      <stop offset="100%" stopColor="#075985"/>
    </linearGradient>
    <linearGradient id="roofTier" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#f97316"/>
      <stop offset="100%" stopColor="#c2410c"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#fef3c7"/>
      <stop offset="50%" stopColor="#fde68a"/>
      <stop offset="100%" stopColor="#d97706"/>
    </linearGradient>
    <linearGradient id="accentBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#10b981"/>
      <stop offset="100%" stopColor="#059669"/>
    </linearGradient>
    <filter id="theoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#082f49" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Base Tile -->
  <rect x="4" y="4" width="40" height="40" rx="10" fill="url(#theoBg)" filter="url(#theoShadow)"/>
  
  <!-- Subtle inner stroke -->
  <rect x="4.5" y="4.5" width="39" height="39" rx="9.5" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- Isometric Ground 5x5 Tile Grid base -->
  <path d="M24 38 L36 32 L24 26 L12 32 Z" fill="#15803d" opacity="0.9"/>
  <path d="M24 38 L36 32 L36 34 L24 40 Z" fill="#166534"/>
  <path d="M12 32 L24 38 L24 40 L12 34 Z" fill="#14532d"/>

  <!-- Campus Building Body (Isometric Block) -->
  <path d="M16 27 L24 23 L32 27 L32 32 L24 36 L16 32 Z" fill="url(#wallGrad)"/>
  <path d="M24 23 L32 27 L32 32 L24 28 Z" fill="#b45309" opacity="0.4"/>

  <!-- Balinese Tiered Roofs (ITB STIKOM Bali signature Meru/Kukul style) -->
  <!-- Bottom Tier -->
  <path d="M14 26 L24 20 L34 26 L24 23 Z" fill="url(#roofTier)"/>
  <!-- Middle Tier -->
  <path d="M17 21 L24 16 L31 21 L24 18.5 Z" fill="url(#roofTier)"/>
  <!-- Top Pagoda Peak -->
  <path d="M20 16 L24 12 L28 16 L24 14.5 Z" fill="#ea580c"/>
  <circle cx="24" cy="12" r="1.5" fill="#fde047"/>

  <!-- Pixel Window Details -->
  <rect x="19" y="28" width="2" height="3" fill="#0284c7" rx="0.5"/>
  <rect x="23" y="30" width="2" height="4" fill="#0284c7" rx="0.5"/>
  <rect x="27" y="28" width="2" height="3" fill="#0284c7" rx="0.5"/>

  <!-- Education & Plugin Badge (Top-Right) -->
  <circle cx="35" cy="13" r="5.5" fill="url(#accentBadge)" filter="url(#theoShadow)"/>
  <path d="M32.5 13 L34.5 15 L38 11.5" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
